<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Matte Canvas -->
    <linearGradient id="matteCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080B"/>
      <stop offset="50%" stop-color="#0D0E13"/>
      <stop offset="100%" stop-color="#060608"/>
    </linearGradient>

    <!-- Liquid Titanium Moving Border (Pure Silver Monochrome) -->
    <linearGradient id="silverLaser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="25%" stop-color="#A1A1AA" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#27272A" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Subtle Dot Grid -->
    <pattern id="microGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.6" fill="#3F3F46" fill-opacity="0.3"/>
    </pattern>

    <filter id="crispGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
    }
    .font-mono {
      font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, monospace;
    }

    /* 1. Pure Silver Liquid Border Running */
    @keyframes silverOrbit {
      0% { stroke-dashoffset: 2200; }
      100% { stroke-dashoffset: 0; }
    }

    /* 2. Minimal Green Server Status Pulse */
    @keyframes minimalPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.9); }
    }

    /* 3. Hi-Fi IEMs Equalizer (Pure Monochrome Silver) */
    @keyframes eq1 { 0%, 100% { height: 4px; y: 12px; } 50% { height: 14px; y: 2px; } }
    @keyframes eq2 { 0%, 100% { height: 12px; y: 4px; } 50% { height: 5px; y: 11px; } }
    @keyframes eq3 { 0%, 100% { height: 6px; y: 10px; } 50% { height: 16px; y: 0px; } }
    @keyframes eq4 { 0%, 100% { height: 15px; y: 1px; } 50% { height: 6px; y: 10px; } }
    @keyframes eq5 { 0%, 100% { height: 9px; y: 7px; } 50% { height: 13px; y: 3px; } }

    .silver-edge {
      stroke-dasharray: 200 900;
      animation: silverOrbit 8s linear infinite;
    }
    .live-dot {
      animation: minimalPulse 2.5s ease-in-out infinite;
      transform-origin: 32px 28px;
    }
    .e1 { animation: eq1 0.75s ease-in-out infinite; }
    .e2 { animation: eq2 0.65s ease-in-out infinite; }
    .e3 { animation: eq3 0.85s ease-in-out infinite; }
    .e4 { animation: eq4 0.7s ease-in-out infinite; }
    .e5 { animation: eq5 0.8s ease-in-out infinite; }
  </style>

  <!-- Canvas Surface -->
  <rect width="850" height="250" rx="14" fill="url(#matteCanvas)"/>
  <rect width="850" height="250" rx="14" fill="url(#microGrid)"/>

  <!-- Static Structure Border -->
  <rect x="1" y="1" width="848" height="248" rx="13" fill="none" stroke="#22242D" stroke-width="1"/>

  <!-- Flowing Silver Border -->
  <rect x="1" y="1" width="848" height="248" rx="13" fill="none" stroke="url(#silverLaser)" stroke-width="1.4" class="silver-edge" filter="url(#crispGlow)"/>

  <!-- Top Ambient HUD Bar -->
  <g transform="translate(32, 28)">
    <!-- Minimal Green Dot -->
    <circle cx="0" cy="0" r="3" fill="#22C55E" class="live-dot"/>
    <text x="12" y="4" fill="#E4E4E7" font-size="11" class="font-mono" font-weight="600" letter-spacing="1">EL_BOT // WORKSTATION</text>

    <!-- IEMs Audio Equalizer (Monochrome Silver) -->
    <g transform="translate(330, -8)">
      <rect x="0" y="2" width="16" height="15" rx="3" fill="#14151C" stroke="#27272A" stroke-width="0.8"/>
      <path d="M 4,10 A 3,3 0 0,1 12,10 M 4,9 L 4,11 M 12,9 L 12,11" stroke="#A1A1AA" stroke-width="1" fill="none"/>
      <!-- Bars -->
      <g transform="translate(22, 0)">
        <rect x="0" y="8" width="2" height="8" rx="1" fill="#A1A1AA" class="e1"/>
        <rect x="4" y="4" width="2" height="12" rx="1" fill="#FFFFFF" class="e2"/>
        <rect x="8" y="10" width="2" height="6" rx="1" fill="#D4D4D8" class="e3"/>
        <rect x="12" y="2" width="2" height="14" rx="1" fill="#FFFFFF" class="e4"/>
        <rect x="16" y="6" width="2" height="10" rx="1" fill="#A1A1AA" class="e5"/>
      </g>
      <text x="48" y="13" fill="#71717A" font-size="10" class="font-mono">IEMs • 24/7 Feed</text>
    </g>

    <!-- Location -->
    <text x="786" y="4" text-anchor="end" fill="#71717A" font-size="11" class="font-mono">Aswan, EG • CS @ AASTMT</text>
  </g>

  <!-- Divider -->
  <line x1="32" y1="48" x2="818" y2="48" stroke="#1C1E26" stroke-width="1"/>

  <!-- Left Column: Identity (Strictly Confined to x=32..460, ZERO COLLISION) -->
  <g transform="translate(32, 94)">
    <text x="0" y="0" fill="#FFFFFF" font-size="30" class="font-sans" font-weight="800" letter-spacing="-0.5">
      MAYER MAMDOUH
    </text>

    <text x="0" y="28" fill="#A1A1AA" font-size="12" class="font-mono" font-weight="500">
      Software Systems &amp; Desktop Architecture
    </text>

    <text x="0" y="52" fill="#71717A" font-size="11" class="font-mono">
      Local-first Windows tools • Steam injection • Low latency
    </text>
  </g>

  <!-- Right Column: Micro Specs (Starts at x=520, Width 298, ZERO COLLISION) -->
  <g transform="translate(520, 68)">
    <!-- CPU -->
    <g transform="translate(0, 0)">
      <rect width="298" height="26" rx="5" fill="#0E1017" stroke="#22242F" stroke-width="0.8"/>
      <text x="12" y="17" fill="#71717A" font-size="10" class="font-mono">CPU</text>
      <text x="286" y="17" text-anchor="end" fill="#E4E4E7" font-size="10" class="font-mono" font-weight="600">Ryzen 5 8400F (Tuned)</text>
    </g>

    <!-- GPU -->
    <g transform="translate(0, 32)">
      <rect width="298" height="26" rx="5" fill="#0E1017" stroke="#22242F" stroke-width="0.8"/>
      <text x="12" y="17" fill="#71717A" font-size="10" class="font-mono">GPU</text>
      <text x="286" y="17" text-anchor="end" fill="#E4E4E7" font-size="10" class="font-mono" font-weight="600">RX 7600 Black Edition</text>
    </g>

    <!-- RAM -->
    <g transform="translate(0, 64)">
      <rect width="298" height="26" rx="5" fill="#0E1017" stroke="#22242F" stroke-width="0.8"/>
      <text x="12" y="17" fill="#71717A" font-size="10" class="font-mono">RAM</text>
      <text x="286" y="17" text-anchor="end" fill="#E4E4E7" font-size="10" class="font-mono" font-weight="600">16GB DDR5 6000MHz CL30</text>
    </g>

    <!-- Stack -->
    <g transform="translate(0, 96)">
      <rect width="298" height="26" rx="5" fill="#0E1017" stroke="#272A38" stroke-width="0.8"/>
      <text x="12" y="17" fill="#A1A1AA" font-size="10" class="font-mono" font-weight="700">CORE</text>
      <text x="286" y="17" text-anchor="end" fill="#F4F4F5" font-size="10" class="font-mono" font-weight="600">C++ • C# • Python • Win32</text>
    </g>
  </g>

  <!-- Bottom Dedicated Full-Width Ethos Bar (ZERO COLLISION with Pills) -->
  <line x1="32" y1="214" x2="818" y2="214" stroke="#1C1E26" stroke-width="1"/>
  <g transform="translate(32, 233)">
    <text x="0" y="0" fill="#71717A" font-size="10" class="font-mono" font-style="italic">
      &gt; "If a process lags, is manual, or takes more than 2 clicks — I build an open-source tool for it."
    </text>
    <text x="786" y="0" text-anchor="end" fill="#52525B" font-size="9" class="font-mono" letter-spacing="1">LOCAL-FIRST // NO TELEMETRY</text>
  </g>
</svg>
