<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bentoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090F"/>
      <stop offset="100%" stop-color="#0B101D"/>
    </linearGradient>

    <linearGradient id="cardFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1424" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#080C16" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Animated Wave Path for PC Booster -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
    }
    .font-mono {
      font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, monospace;
    }

    /* 1. Oscillating Waveform for PC Booster */
    @keyframes waveFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -200; }
    }

    /* 2. Radar Sweep for NightByte */
    @keyframes radarSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* 3. Pulse Heartbeat for GreenLuma */
    @keyframes pulseRing {
      0% { r: 6px; opacity: 1; }
      100% { r: 18px; opacity: 0; }
    }

    .wave-line {
      stroke-dasharray: 8 6;
      animation: waveFlow 4s linear infinite;
    }
    .radar-beam {
      animation: radarSpin 5s linear infinite;
      transform-origin: 360px 48px;
    }
    .pulse-emitter {
      animation: pulseRing 1.8s ease-out infinite;
      transform-origin: 32px 36px;
    }
  </style>

  <!-- Container Base -->
  <rect width="850" height="280" rx="16" fill="url(#bentoBg)"/>
  <rect x="1" y="1" width="848" height="278" rx="15" fill="none" stroke="#1E293B" stroke-width="1.2"/>

  <!-- ==================== CARD 1: GREENLUMA STEALTH MANAGER (LEFT HERO) ==================== -->
  <g transform="translate(16, 16)">
    <rect width="400" height="248" rx="12" fill="url(#cardFill)" stroke="#1E293B" stroke-width="1"/>
    <!-- Top Accent Bar -->
    <rect x="0" y="0" width="400" height="3" rx="1.5" fill="url(#cyanGrad)"/>

    <!-- Pulse Icon Indicator -->
    <g transform="translate(18, 14)">
      <circle cx="14" cy="14" r="8" fill="#00F0FF" fill-opacity="0.15"/>
      <circle cx="14" cy="14" r="4" fill="#00F0FF" filter="url(#glowFilter)"/>
      <circle cx="14" cy="14" r="14" fill="none" stroke="#00F0FF" stroke-width="1.2" class="pulse-emitter"/>
    </g>

    <text x="56" y="32" fill="#F8FAFC" font-size="14" class="font-sans" font-weight="700">GreenLuma Stealth Manager</text>
    <text x="56" y="48" fill="#38BDF8" font-size="10" class="font-mono" font-weight="600">STEALTH INJECTION ENGINE</text>

    <!-- Description -->
    <text x="20" y="80" fill="#94A3B8" font-size="11" class="font-mono">Automated Steam family runtime injector.</text>
    <text x="20" y="98" fill="#64748B" font-size="10" class="font-mono">Handles license parsing &amp; slot priority safely.</text>

    <!-- Key Engineering Specs Grid -->
    <g transform="translate(20, 118)">
      <rect width="360" height="28" rx="6" fill="#080D1A" stroke="#1E293B" stroke-width="0.8"/>
      <text x="12" y="18" fill="#64748B" font-size="10" class="font-mono">Zero-BOM Engine</text>
      <text x="348" y="18" text-anchor="end" fill="#00F0FF" font-size="10" class="font-mono" font-weight="700">BOM-Free UTF-8</text>
    </g>

    <g transform="translate(20, 152)">
      <rect width="360" height="28" rx="6" fill="#080D1A" stroke="#1E293B" stroke-width="0.8"/>
      <text x="12" y="18" fill="#64748B" font-size="10" class="font-mono">Primary License</text>
      <text x="348" y="18" text-anchor="end" fill="#38BDF8" font-size="10" class="font-mono" font-weight="700">Slot 90 Enforced</text>
    </g>

    <g transform="translate(20, 186)">
      <rect width="360" height="28" rx="6" fill="#080D1A" stroke="#1E293B" stroke-width="0.8"/>
      <text x="12" y="18" fill="#64748B" font-size="10" class="font-mono">Hook Lifespan</text>
      <text x="348" y="18" text-anchor="end" fill="#10B981" font-size="10" class="font-mono" font-weight="700">Purged on Exit</text>
    </g>

    <!-- Footer Tags -->
    <text x="20" y="234" fill="#475569" font-size="10" class="font-mono">STACK: C# • .NET • Win32 API • Steamworks</text>
  </g>

  <!-- ==================== CARD 2: PC BOOSTER (TOP RIGHT) ==================== -->
  <g transform="translate(432, 16)">
    <rect width="402" height="118" rx="12" fill="url(#cardFill)" stroke="#1E293B" stroke-width="1"/>
    <rect x="0" y="0" width="402" height="3" rx="1.5" fill="url(#emeraldGrad)"/>

    <g transform="translate(18, 14)">
      <circle cx="14" cy="14" r="4" fill="#10B981" filter="url(#glowFilter)"/>
    </g>
    <text x="46" y="32" fill="#F8FAFC" font-size="13" class="font-sans" font-weight="700">PC Booster // Reversible Tweaker</text>
    <text x="46" y="46" fill="#34D399" font-size="9" class="font-mono" font-weight="600">ZERO FORCED-KILLS • LOCAL-FIRST</text>

    <!-- Animated Smooth Waveform Track -->
    <g transform="translate(20, 58)">
      <rect width="362" height="26" rx="6" fill="#05121B" stroke="#0F382E" stroke-width="0.8"/>
      <path d="M 10,13 Q 30,2 50,13 T 90,13 T 130,13 T 170,13 T 210,13 T 250,13 T 290,13 T 330,13 T 355,13" fill="none" stroke="#10B981" stroke-width="1.8" class="wave-line"/>
    </g>

    <text x="20" y="104" fill="#64748B" font-size="10" class="font-mono">Python • Safe Windows Monitoring • Standalone EXE</text>
  </g>

  <!-- ==================== CARD 3: NIGHTBYTE AI (BOTTOM RIGHT) ==================== -->
  <g transform="translate(432, 146)">
    <rect width="402" height="118" rx="12" fill="url(#cardFill)" stroke="#1E293B" stroke-width="1"/>
    <rect x="0" y="0" width="402" height="3" rx="1.5" fill="url(#purpleGrad)"/>

    <!-- Radar Circle -->
    <g transform="translate(18, 14)">
      <circle cx="14" cy="14" r="10" fill="none" stroke="#8B5CF6" stroke-width="0.8"/>
      <circle cx="14" cy="14" r="4" fill="#EC4899" filter="url(#glowFilter)"/>
      <line x1="14" y1="14" x2="24" y2="14" stroke="#00F0FF" stroke-width="1.2" class="radar-beam" transform-origin="14px 14px"/>
    </g>

    <text x="46" y="32" fill="#F8FAFC" font-size="13" class="font-sans" font-weight="700">NightByte // Download Guardian</text>
    <text x="46" y="46" fill="#C084FC" font-size="9" class="font-mono" font-weight="600">NETWORK DROP PROTECTION • MULTI-LAUNCHER</text>

    <text x="20" y="78" fill="#94A3B8" font-size="10" class="font-mono">Freezes power shutdown timer if internet disconnects overnight.</text>
    <text x="20" y="94" fill="#64748B" font-size="10" class="font-mono">Deep parsing for Steam (.vdf, .acf), Epic, EA &amp; Torrents.</text>
    <text x="20" y="110" fill="#475569" font-size="9" class="font-mono">PySide6 / Qt • Async Network Sentry • Win32</text>
  </g>
</svg>
