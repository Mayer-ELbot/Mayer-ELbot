<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 270" width="100%" height="100%">
  <defs>
    <!-- Dark Titanium Matte Canvas -->
    <linearGradient id="bentoMatte" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080C"/>
      <stop offset="50%" stop-color="#0D0E14"/>
      <stop offset="100%" stop-color="#06070B"/>
    </linearGradient>

    <!-- Card Surface (Glass Obsidian) -->
    <linearGradient id="cardGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11131A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0A0B10" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Top White/Silver Edge Highlight -->
    <linearGradient id="silverShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#71717A" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="microBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
    }
    .font-mono {
      font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, monospace;
    }

    /* 1. Rolling Waveform (Silver/Monochrome) */
    @keyframes waveRoll {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -200; }
    }

    /* 2. Soft Radar Sweep */
    @keyframes radarSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* 3. Soft Injection Pulse */
    @keyframes pulseRing {
      0% { r: 4px; opacity: 1; }
      100% { r: 14px; opacity: 0; }
    }

    .wave-line {
      stroke-dasharray: 6 5;
      animation: waveRoll 3.5s linear infinite;
    }
    .radar-sweep {
      animation: radarSpin 4.5s linear infinite;
      transform-origin: 14px 14px;
    }
    .pulse-glow {
      animation: pulseRing 2s ease-out infinite;
      transform-origin: 14px 14px;
    }
  </style>

  <!-- Container Base -->
  <rect width="850" height="270" rx="14" fill="url(#bentoMatte)"/>
  <rect x="1" y="1" width="848" height="268" rx="13" fill="none" stroke="#22242F" stroke-width="1"/>

  <!-- ==================== CARD 1: GREENLUMA STEALTH MANAGER (LEFT HERO) ==================== -->
  <g transform="translate(16, 16)">
    <rect width="395" height="238" rx="10" fill="url(#cardGlass)" stroke="#22242F" stroke-width="1"/>
    <rect x="0" y="0" width="395" height="2" rx="1" fill="url(#silverShine)"/>

    <!-- Soft Green Status Beacon -->
    <g transform="translate(18, 16)">
      <circle cx="14" cy="14" r="6" fill="#22C55E" fill-opacity="0.1"/>
      <circle cx="14" cy="14" r="3" fill="#22C55E"/>
      <circle cx="14" cy="14" r="12" fill="none" stroke="#22C55E" stroke-width="1" class="pulse-glow"/>
    </g>

    <text x="56" y="32" fill="#FFFFFF" font-size="13" class="font-sans" font-weight="700">GreenLuma Stealth Manager</text>
    <text x="56" y="46" fill="#A1A1AA" font-size="10" class="font-mono">RUNTIME HOOK &amp; INJECTION</text>

    <!-- Description -->
    <text x="20" y="74" fill="#A1A1AA" font-size="11" class="font-mono">Automated Steam runtime manager.</text>
    <text x="20" y="90" fill="#71717A" font-size="10" class="font-mono">Zero-residual injection &amp; BOM-free license parser.</text>

    <!-- Specs Grid (Width 359, clearance between 110 and 240 is 130px!) -->
    <g transform="translate(18, 108)">
      <rect width="359" height="26" rx="5" fill="#0A0B10" stroke="#1E202B" stroke-width="0.8"/>
      <text x="12" y="17" fill="#71717A" font-size="10" class="font-mono">Config Format</text>
      <text x="347" y="17" text-anchor="end" fill="#E4E4E7" font-size="10" class="font-mono" font-weight="600">BOM-Free UTF-8</text>
    </g>

    <g transform="translate(18, 140)">
      <rect width="359" height="26" rx="5" fill="#0A0B10" stroke="#1E202B" stroke-width="0.8"/>
      <text x="12" y="17" fill="#71717A" font-size="10" class="font-mono">Primary License</text>
      <text x="347" y="17" text-anchor="end" fill="#E4E4E7" font-size="10" class="font-mono" font-weight="600">Slot 90 Enforced</text>
    </g>

    <g transform="translate(18, 172)">
      <rect width="359" height="26" rx="5" fill="#0A0B10" stroke="#1E202B" stroke-width="0.8"/>
      <text x="12" y="17" fill="#71717A" font-size="10" class="font-mono">Hook Lifespan</text>
      <text x="347" y="17" text-anchor="end" fill="#22C55E" font-size="10" class="font-mono" font-weight="600">Purged on Exit</text>
    </g>

    <!-- Footer -->
    <text x="20" y="222" fill="#52525B" font-size="10" class="font-mono">STACK: C# • .NET • Win32 • Steamworks</text>
  </g>

  <!-- ==================== CARD 2: PC BOOSTER (TOP RIGHT) ==================== -->
  <g transform="translate(427, 16)">
    <rect width="407" height="113" rx="10" fill="url(#cardGlass)" stroke="#22242F" stroke-width="1"/>
    <rect x="0" y="0" width="407" height="2" rx="1" fill="url(#silverShine)"/>

    <g transform="translate(18, 14)">
      <circle cx="14" cy="14" r="3" fill="#22C55E"/>
    </g>
    <text x="46" y="32" fill="#FFFFFF" font-size="13" class="font-sans" font-weight="700">PC Booster // System Suite</text>
    <text x="46" y="46" fill="#71717A" font-size="10" class="font-mono">LOCAL-FIRST • ZERO FORCE-KILLS</text>

    <!-- Waveform (Silver) -->
    <g transform="translate(18, 56)">
      <rect width="371" height="24" rx="5" fill="#0A0B10" stroke="#1E202B" stroke-width="0.8"/>
      <path d="M 10,12 Q 30,3 50,12 T 90,12 T 130,12 T 170,12 T 210,12 T 250,12 T 290,12 T 330,12 T 360,12" fill="none" stroke="#D4D4D8" stroke-width="1.5" class="wave-line"/>
    </g>

    <text x="20" y="100" fill="#52525B" font-size="10" class="font-mono">Python • Reversible Windows Tweaks • Standalone EXE</text>
  </g>

  <!-- ==================== CARD 3: NIGHTBYTE AI (BOTTOM RIGHT) ==================== -->
  <g transform="translate(427, 141)">
    <rect width="407" height="113" rx="10" fill="url(#cardGlass)" stroke="#22242F" stroke-width="1"/>
    <rect x="0" y="0" width="407" height="2" rx="1" fill="url(#silverShine)"/>

    <!-- Minimal Radar -->
    <g transform="translate(18, 14)">
      <circle cx="14" cy="14" r="8" fill="none" stroke="#3F3F46" stroke-width="0.8"/>
      <circle cx="14" cy="14" r="2.5" fill="#A1A1AA"/>
      <line x1="14" y1="14" x2="22" y2="14" stroke="#FFFFFF" stroke-width="1" class="radar-sweep"/>
    </g>

    <text x="46" y="32" fill="#FFFFFF" font-size="13" class="font-sans" font-weight="700">NightByte // Download Guardian</text>
    <text x="46" y="46" fill="#71717A" font-size="10" class="font-mono">NETWORK DROP SENTRY • MULTI-LAUNCHER</text>

    <text x="20" y="74" fill="#A1A1AA" font-size="10" class="font-mono">Freezes shutdown countdown if internet drops overnight.</text>
    <text x="20" y="90" fill="#71717A" font-size="10" class="font-mono">Deep parsing for Steam, Epic, EA, Battle.net &amp; Torrents.</text>
    <text x="20" y="104" fill="#52525B" font-size="9" class="font-mono">PySide6 / Qt • Async Network Engine • Win32</text>
  </g>
</svg>
