<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B11"/>
      <stop offset="50%" stop-color="#0D111A"/>
      <stop offset="100%" stop-color="#080A0F"/>
    </linearGradient>

    <!-- Subtle Border Gradient -->
    <linearGradient id="borderStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="80%" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Text Glow -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Spec Pill Fill -->
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Subtle Grid Background -->
    <pattern id="gridDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#334155" fill-opacity="0.35"/>
    </pattern>

    <filter id="neonPulse" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, monospace;
    }
    @keyframes beacon {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }
    .live-dot {
      animation: beacon 2.4s ease-in-out infinite;
      transform-origin: 30px 24px;
    }
  </style>

  <!-- Base Card -->
  <rect width="850" height="240" rx="14" fill="url(#cardBg)"/>
  <rect width="850" height="240" rx="14" fill="url(#gridDots)"/>
  <rect x="1" y="1" width="848" height="238" rx="13" fill="none" stroke="url(#borderStroke)" stroke-width="1.2"/>

  <!-- Top Ambient HUD Bar -->
  <g transform="translate(32, 28)">
    <!-- Status Indicator -->
    <circle cx="0" cy="0" r="3.5" fill="#00F0FF" class="live-dot" filter="url(#neonPulse)"/>
    <text x="12" y="4" fill="#00F0FF" font-size="11" class="font-mono" font-weight="700" letter-spacing="1.5">EL_BOT // ARCHITECTURE</text>
    <text x="786" y="4" text-anchor="end" fill="#64748B" font-size="11" class="font-mono">Alexandria, EG • CS @ AASTMT</text>
  </g>

  <!-- Subtle Divider Line -->
  <line x1="32" y1="46" x2="818" y2="46" stroke="#1E293B" stroke-width="1"/>

  <!-- Left Column: Hero Name & Core Statement -->
  <g transform="translate(32, 86)">
    <text x="0" y="0" fill="url(#textGrad)" font-size="34" class="font-sans" font-weight="900" letter-spacing="-0.8">
      MAYER MAMDOUH
    </text>
    
    <text x="0" y="30" fill="#94A3B8" font-size="13" class="font-mono" font-weight="500">
      Systems Hacker • AI Vibecoder • Windows Tooling
    </text>

    <text x="0" y="58" fill="#CBD5E1" font-size="12" class="font-mono" font-weight="400">
      Building local-first apps, Steam extensions &amp; performance software.
    </text>

    <!-- Ethos Line -->
    <text x="0" y="82" fill="#64748B" font-size="11" class="font-mono" font-style="italic">
      &gt; "If a process lags, is repetitive, or takes more than two clicks — I build a tool for it."
    </text>
  </g>

  <!-- Right Column: Micro Rig & Stack Specs -->
  <g transform="translate(560, 72)">
    <!-- Spec Card 1: CPU -->
    <g transform="translate(0, 0)">
      <rect width="258" height="28" rx="6" fill="url(#pillBg)" stroke="#1E293B" stroke-width="0.8"/>
      <text x="12" y="18" fill="#64748B" font-size="10" class="font-mono">CPU</text>
      <text x="246" y="18" text-anchor="end" fill="#E2E8F0" font-size="10" class="font-mono" font-weight="600">Ryzen 5 8400F (Tuned)</text>
    </g>

    <!-- Spec Card 2: GPU -->
    <g transform="translate(0, 34)">
      <rect width="258" height="28" rx="6" fill="url(#pillBg)" stroke="#1E293B" stroke-width="0.8"/>
      <text x="12" y="18" fill="#64748B" font-size="10" class="font-mono">GPU</text>
      <text x="246" y="18" text-anchor="end" fill="#E2E8F0" font-size="10" class="font-mono" font-weight="600">RX 7600 Black Edition</text>
    </g>

    <!-- Spec Card 3: Memory & Display -->
    <g transform="translate(0, 68)">
      <rect width="258" height="28" rx="6" fill="url(#pillBg)" stroke="#1E293B" stroke-width="0.8"/>
      <text x="12" y="18" fill="#64748B" font-size="10" class="font-mono">RAM</text>
      <text x="246" y="18" text-anchor="end" fill="#E2E8F0" font-size="10" class="font-mono" font-weight="600">16GB DDR5 6000 CL30</text>
    </g>

    <!-- Spec Card 4: Focus -->
    <g transform="translate(0, 102)">
      <rect width="258" height="28" rx="6" fill="url(#pillBg)" stroke="#0284C7" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="12" y="18" fill="#38BDF8" font-size="10" class="font-mono">STACK</text>
      <text x="246" y="18" text-anchor="end" fill="#38BDF8" font-size="10" class="font-mono" font-weight="700">C++ • C# • Python • Win32</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="32" y1="216" x2="818" y2="216" stroke="#1E293B" stroke-width="1"/>
  <text x="50%" y="228" text-anchor="middle" fill="#475569" font-size="9" class="font-mono" letter-spacing="2">
    OPEN SOURCE SOFTWARE • LOCAL-FIRST • ZERO TELEMETRY
  </text>
</svg>
