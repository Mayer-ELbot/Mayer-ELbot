<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="100%">
  <defs>
    <!-- Premium Obsidian Background -->
    <linearGradient id="obsidianBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090A0F"/>
      <stop offset="50%" stop-color="#0E1017"/>
      <stop offset="100%" stop-color="#07080C"/>
    </linearGradient>

    <!-- Liquid Titanium Moving Border (Monochrome Luxury) -->
    <linearGradient id="titaniumLaser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#94A3B8" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#334155" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Ambient Subtle White Halo (Not Neon) -->
    <radialGradient id="ambientHalo" cx="30%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Micro Tech Grid -->
    <pattern id="fineGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.65" fill="#52525B" fill-opacity="0.25"/>
    </pattern>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
    }
    .font-mono {
      font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, monospace;
    }

    /* 1. Subtle White Liquid Border Orbit */
    @keyframes titaniumOrbit {
      0% { stroke-dashoffset: 2200; }
      100% { stroke-dashoffset: 0; }
    }

    /* 2. Soft Status Pulse */
    @keyframes softPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.9); }
    }

    /* 3. Hi-Fi IEMs Equalizer Dancing (Silver/Monochrome) */
    @keyframes bar1 { 0%, 100% { height: 4px; y: 14px; } 50% { height: 16px; y: 2px; } }
    @keyframes bar2 { 0%, 100% { height: 14px; y: 4px; } 50% { height: 6px; y: 12px; } }
    @keyframes bar3 { 0%, 100% { height: 8px; y: 10px; } 50% { height: 18px; y: 0px; } }
    @keyframes bar4 { 0%, 100% { height: 18px; y: 0px; } 50% { height: 8px; y: 10px; } }
    @keyframes bar5 { 0%, 100% { height: 12px; y: 6px; } 50% { height: 16px; y: 2px; } }

    .titanium-border {
      stroke-dasharray: 220 880;
      animation: titaniumOrbit 8s linear infinite;
    }
    .status-dot {
      animation: softPulse 2.5s ease-in-out infinite;
      transform-origin: 32px 28px;
    }
    .b1 { animation: bar1 0.7s ease-in-out infinite; }
    .b2 { animation: bar2 0.6s ease-in-out infinite; }
    .b3 { animation: bar3 0.8s ease-in-out infinite; }
    .b4 { animation: bar4 0.65s ease-in-out infinite; }
    .b5 { animation: bar5 0.75s ease-in-out infinite; }
  </style>

  <!-- Base Canvas -->
  <rect width="850" height="250" rx="14" fill="url(#obsidianBg)"/>
  <rect width="850" height="250" rx="14" fill="url(#ambientHalo)"/>
  <rect width="850" height="250" rx="14" fill="url(#fineGrid)"/>

  <!-- Static Structure Border -->
  <rect x="1" y="1" width="848" height="248" rx="13" fill="none" stroke="#27272A" stroke-width="1"/>

  <!-- Flowing Titanium Border -->
  <rect x="1" y="1" width="848" height="248" rx="13" fill="none" stroke="url(#titaniumLaser)" stroke-width="1.5" class="titanium-border" filter="url(#softGlow)"/>

  <!-- Top Ambient HUD Bar -->
  <g transform="translate(32, 28)">
    <!-- Status Beacon (Minimal Green) -->
    <circle cx="0" cy="0" r="3" fill="#22C55E" class="status-dot"/>
    <text x="12" y="4" fill="#E4E4E7" font-size="11" class="font-mono" font-weight="600" letter-spacing="1">EL_BOT // WORKSTATION</text>

    <!-- IEMs Audio Equalizer (Monochrome Hi-Fi) -->
    <g transform="translate(340, -9)">
      <rect x="0" y="2" width="16" height="16" rx="4" fill="#18181B" stroke="#27272A" stroke-width="0.8"/>
      <!-- Audio wave icon -->
      <path d="M 4,11 A 3,3 0 0,1 12,11 M 4,10 L 4,12 M 12,10 L 12,12" stroke="#A1A1AA" stroke-width="1" fill="none"/>
      <!-- Animated Equalizer Bars -->
      <g transform="translate(22, 0)">
        <rect x="0" y="8" width="2" height="10" rx="1" fill="#D4D4D8" class="b1"/>
        <rect x="4" y="4" width="2" height="14" rx="1" fill="#FFFFFF" class="b2"/>
        <rect x="8" y="10" width="2" height="8" rx="1" fill="#A1A1AA" class="b3"/>
        <rect x="12" y="2" width="2" height="16" rx="1" fill="#FFFFFF" class="b4"/>
        <rect x="16" y="6" width="2" height="12" rx="1" fill="#D4D4D8" class="b5"/>
      </g>
      <text x="48" y="13" fill="#71717A" font-size="10" class="font-mono">IEMs • 24/7 Audio</text>
    </g>

    <!-- Location & University -->
    <text x="786" y="4" text-anchor="end" fill="#71717A" font-size="11" class="font-mono">Alexandria, EG • CS @ AASTMT</text>
  </g>

  <!-- Divider Line -->
  <line x1="32" y1="48" x2="818" y2="48" stroke="#1E2028" stroke-width="1"/>

  <!-- Left Side: Identity (No Overlaps, Width Restricted to 460px) -->
  <g transform="translate(32, 90)">
    <text x="0" y="0" fill="#FFFFFF" font-size="30" class="font-sans" font-weight="800" letter-spacing="-0.5">
      MAYER MAMDOUH
    </text>

    <text x="0" y="26" fill="#A1A1AA" font-size="12" class="font-mono" font-weight="500">
      Software Engineer &amp; Systems Builder
    </text>

    <text x="0" y="52" fill="#71717A" font-size="11" class="font-mono">
      Building local-first tools &amp; Windows utilities.
    </text>

    <text x="0" y="74" fill="#52525B" font-size="11" class="font-mono" font-style="italic">
      &gt; "If it takes more than 2 clicks — I build a tool for it."
    </text>
  </g>

  <!-- Right Side: Hardware & Core Specs (Starts at x=520, Clean & Spacious) -->
  <g transform="translate(520, 68)">
    <!-- CPU -->
    <g transform="translate(0, 0)">
      <rect width="298" height="28" rx="6" fill="#11131A" stroke="#222530" stroke-width="0.8"/>
      <text x="12" y="18" fill="#71717A" font-size="10" class="font-mono">CPU</text>
      <text x="286" y="18" text-anchor="end" fill="#E4E4E7" font-size="10" class="font-mono" font-weight="600">Ryzen 5 8400F (Tuned)</text>
    </g>

    <!-- GPU -->
    <g transform="translate(0, 34)">
      <rect width="298" height="28" rx="6" fill="#11131A" stroke="#222530" stroke-width="0.8"/>
      <text x="12" y="18" fill="#71717A" font-size="10" class="font-mono">GPU</text>
      <text x="286" y="18" text-anchor="end" fill="#E4E4E7" font-size="10" class="font-mono" font-weight="600">RX 7600 Black Edition</text>
    </g>

    <!-- Memory -->
    <g transform="translate(0, 68)">
      <rect width="298" height="28" rx="6" fill="#11131A" stroke="#222530" stroke-width="0.8"/>
      <text x="12" y="18" fill="#71717A" font-size="10" class="font-mono">RAM</text>
      <text x="286" y="18" text-anchor="end" fill="#E4E4E7" font-size="10" class="font-mono" font-weight="600">16GB DDR5 6000MHz CL30</text>
    </g>

    <!-- Stack -->
    <g transform="translate(0, 102)">
      <rect width="298" height="28" rx="6" fill="#11131A" stroke="#27272A" stroke-width="0.8"/>
      <text x="12" y="18" fill="#A1A1AA" font-size="10" class="font-mono" font-weight="700">CORE</text>
      <text x="286" y="18" text-anchor="end" fill="#F4F4F5" font-size="10" class="font-mono" font-weight="600">C++ • C# • Python • Win32</text>
    </g>
  </g>

  <!-- Bottom Minimal Status Bar -->
  <line x1="32" y1="216" x2="818" y2="216" stroke="#1E2028" stroke-width="1"/>
  <g transform="translate(32, 234)">
    <text x="0" y="0" fill="#71717A" font-size="10" class="font-mono">
      <tspan fill="#A1A1AA" font-weight="600">● LOCAL-FIRST</tspan>  •  ZERO TELEMETRY  •  REVERSIBLE TWEAKS
    </text>
    <text x="786" y="0" text-anchor="end" fill="#71717A" font-size="10" class="font-mono">OPEN SOURCE CODEBASES</text>
  </g>
</svg>
