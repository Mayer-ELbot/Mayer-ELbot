name: Auto-Update Profile & Streak Shield

on:
  schedule:
    # Run twice a day at 00:00 and 12:00 UTC
    - cron: "0 0,12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'

jobs:
  update-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update Streak Card & Auto-Activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_streak.py
          python scripts/update_readme.py

      - name: Commit and Push Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/streak_card.svg README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto-update): refresh streak shields and activity pulse" && git push)
